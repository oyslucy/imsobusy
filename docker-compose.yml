services:
  app:
    build: .
    ports:
      - "80:8000"
    volumes:
      - app_data:/app/backend/data
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
    restart: unless-stopped

volumes:
  app_data:
